# ==========================================================
# VirtualHost para LectoEscritura (EVAL)
#
# El DocumentRoot debe ser la RAÍZ del repositorio: toda la app
# usa rutas relativas ("../public/...", "../config/...") y asume
# que vive un nivel por debajo de la raíz del sitio.
#
# Después de editar este archivo: reiniciá Apache desde el
# panel de XAMPP (o "net stop apache" + "net start apache").
# ==========================================================

<VirtualHost *:80>
    ServerName lectoescritura.local
    DocumentRoot "C:/Users/Cami/Documents/EVAL/LectoEscritura"

    <Directory "C:/Users/Cami/Documents/EVAL/LectoEscritura">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/lectoescritura-error.log"
    CustomLog "logs/lectoescritura-access.log" common
</VirtualHost>
