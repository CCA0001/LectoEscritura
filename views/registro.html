<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Eva</title>
    <link rel="stylesheet" href="../public/css/registro.css">
</head>
<body>

<div class="container">
    <div class="form-card">
        <h2>Crear cuenta</h2>
        <p>Ingresa tus datos para registrarte</p>

       <form id="formRegistro">
            
            <div class="input-group">
                <input type="text" id="nombre" placeholder="Nombre de Usuario" required>
            </div>

            <div class="input-group email-field">
                <input type="text" id="correo" placeholder="Correo institucional" required>
                <span class="domain">@ucundinamarca.edu.co</span>
            </div>

            <div class="input-group">
                <input type="password" id="contrasenia" placeholder="Contraseña" required>
            </div>

            <div class="input-group">
                <input id="confirmarContrasenia" type="password" placeholder="Confirmar contraseña" required>
            </div>

            <button type="submit" class="btn-ingresar">Registrarse</button>
        </form>

        <div class="footer-text">
            ¿Ya tienes cuenta? <a href="login.html" class="link-verde">Iniciar sesión</a>
        </div>
    </div>
</div>

<script src="../public/JS/Auth/obtenerDatosRegistro.js"></script>
</body>
</html>
