<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eva - Iniciar Sesión</title>
    <link rel="stylesheet" href="../public/css/login.css">
</head>
<body>

    <div class="login-card">
        <h2>Iniciar Sesión</h2>
        
        <form id="formLogin">
            <div class="input-group">
                <label>Correo Institucional:</label>
                <input id="correo" type="email" name="correo_electronico" placeholder="ejemplo@ucundinamarca.edu.co" required>
            </div>
            
            <div class="input-group">
                <label>Contraseña:</label>
                <input id="contrasenia" type="password" name="contrasenia_hash" placeholder="Tu contraseña" required>
            </div>
            
            <button id="btn-ingresar" type="submit" class="btn-ingresar">Ingresar</button>
        </form>

        <p class="footer-text">
            ¿No tienes cuenta? <a href="registro.html">Crear cuenta</a>
        </p>
        <p class="footer-text">
            ¿Eres administrador? <a href="login_admin.php">Acceso administradores</a>
        </p>
    </div>

    <script src="../public/JS/Auth/obtenerDatosLogin.js"></script>
</body>
</html>
